# Render Blueprint — Observatorio Virtual de Astronomía
# UN SOLO servicio: el servidor Node + ws sirve TAMBIÉN el index.html.
# Así basta una única URL (sin ?ws= manual): el cliente, al cargarse por
# https, abre el WebSocket contra su mismo origen automáticamente.
#
# Cómo usarlo:
#   Render → New → Blueprint → conectar este repo → Apply.
#   (O bien un único Web Service manual con la config de abajo.)
#
# Acceso final: solo comparte  https://<tu-servicio>.onrender.com
#   — sirve el cliente Y el multiusuario en la misma URL.
#   El panel "Invitar" genera el QR de esa URL automáticamente.

services:
  - type: web
    name: observatorio-virtual
    runtime: node
    plan: free
    rootDir: server          # cwd para build/start; el repo entero se clona,
                             # así que server.js lee ../index.html sin problema.
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
