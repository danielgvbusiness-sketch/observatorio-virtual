# Render Blueprint — Observatorio Virtual de Astronomía
# Despliega DOS servicios desde este mismo repo de GitHub:
#   1) observatorio-servidor : Web Service Node + ws (proceso persistente, wss://)
#   2) observatorio-cliente   : Static Site que sirve index.html (CDN)
#
# Cómo usarlo:
#   Render → New → Blueprint → conectar este repo → Apply.
#   Render crea ambos servicios automáticamente con esta configuración.
#
# Link de acceso final (ver §7c del plan):
#   https://observatorio-cliente.onrender.com/?ws=wss://observatorio-servidor.onrender.com
#   (ojo: wss://, no ws://, porque el servidor se sirve sobre HTTPS)

services:
  # ----------------------------------------------------------------
  # SERVIDOR — Node + ws, autoritativo. Único puerto HTTP (Render
  # inyecta PORT); el WebSocket viaja sobre ese mismo servidor.
  # ----------------------------------------------------------------
  - type: web
    name: observatorio-servidor
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /

  # ----------------------------------------------------------------
  # CLIENTE — index.html estático servido por CDN. Sin build.
  # ----------------------------------------------------------------
  - type: web
    name: observatorio-cliente
    runtime: static
    rootDir: .
    buildCommand: ""
    staticPublishPath: .
